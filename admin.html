<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Pri da Fran's Brigaderie</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'DM Sans', sans-serif; }
        body { background: #faf4f7; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 950px; margin: 0 auto; }
        h1, h2 { color: #d63384; }
        .card { background: white; padding: 20px; border-radius: 15px; border: 1px solid #f1dce6; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .form-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        input, select, button { padding: 12px; border-radius: 10px; border: 1px solid #ddd; outline: none; }
        input[type="text"] { flex: 2; min-width: 180px; }
        input[type="number"] { width: 120px; }
        button.btn-add { background: #d63384; color: white; border: none; font-weight: bold; cursor: pointer; }
        button.btn-add:hover { background: #b8256e; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { color: #888; font-size: 13px; text-transform: uppercase; }
        .badge { padding: 4px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; }
        .badge-disponivel { background: #e6f4ea; color: #1e7e34; }
        .badge-indisponivel { background: #fce8e6; color: #c5221f; }
        .btn-action { padding: 6px 10px; font-size: 12px; border-radius: 8px; cursor: pointer; border: none; margin-right: 4px; }
        .btn-toggle { background: #e2e8f0; color: #333; }
        .btn-star { background: #fff3cd; color: #856404; }
        .btn-delete { background: #f8d7da; color: #721c24; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .stat-card { background: white; padding: 15px; border-radius: 12px; border: 1px solid #f1dce6; text-align: center; }
        .stat-card h3 { margin: 0; font-size: 1.8rem; color: #d63384; }
        .stat-card p { margin: 5px 0 0 0; color: #666; font-size: 13px; }
        .input-preco-tabela { width: 90px; padding: 6px; text-align: center; border-radius: 6px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="container">
    <h1>👑 Painel Administrativo Restrito</h1>
    <p>Área exclusiva para controlo de sabores, preços, disponibilidades e destaques da loja.</p>

    <!-- DASHBOARD -->
    <div class="card">
        <h2>📊 Dashboard & Estatísticas</h2>
        <div class="dashboard-grid" id="stats-container">
            <!-- Gerado via JS -->
        </div>
    </div>

    <!-- CADASTRAR NOVO SABOR -->
    <div class="card">
        <h2>➕ Cadastrar Novo Sabor/Produto</h2>
        <div class="form-group">
            <input type="text" id="novo-sabor-nome" placeholder="Nome (Ex: Ninho com Nutella)">
            <select id="novo-sabor-categoria">
                <option value="Brigadeiros">Brigadeiros</option>
                <option value="Geladinhos">Geladinhos</option>
                <option value="Sobremesas">Sobremesas</option>
            </select>
            <input type="number" id="novo-sabor-preco" placeholder="Preço (R$)" step="0.50" min="0">
            <button class="btn-add" onclick="adicionarSabor()">Cadastrar</button>
        </div>
    </div>

    <!-- GERENCIAR SABORES -->
    <div class="card">
        <h2>🍬 Gerenciar Sabores e Preços</h2>
        <table>
            <thead>
                <tr>
                    <th>Sabor</th>
                    <th>Categoria</th>
                    <th>Preço (R$)</th>
                    <th>Status</th>
                    <th>Destaque</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-sabores">
                <!-- Inserido via JS -->
            </tbody>
        </table>
    </div>
</div>

<!-- SDK Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://zayyoomqxamctnekdxcz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpheXlvb21xeGFtY3RuZWtkeGN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5OTA4MzgsImV4cCI6MjEwOTU2NjgzOH0.pykO6wcCVgarjnSfdvgfJnpBBEXK8S1IcSllMb4wops';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function carregarPainelAdmin() {
        const { data: sabores, error } = await supabaseClient
            .from('flavors')
            .select('*')
            .order('id', { ascending: false });

        if (error) {
            alert('Erro ao carregar painel: ' + error.message);
            return;
        }

        const tbody = document.getElementById('tabela-sabores');
        tbody.innerHTML = '';

        let totalSabores = sabores.length;
        let disponiveis = 0;
        let maisVendidoSabor = { nome: '-', vendas: 0 };

        sabores.forEach(sabor => {
            if (sabor.status === 'disponivel') disponiveis++;
            if ((sabor.vendas || 0) > maisVendidoSabor.vendas) {
                maisVendidoSabor = { nome: sabor.nome, vendas: sabor.vendas };
            }

            const tr = document.createElement('tr');
            const statusClass = sabor.status === 'disponivel' ? 'badge-disponivel' : 'badge-indisponivel';
            const statusTexto = sabor.status === 'disponivel' ? 'Disponível' : 'Indisponível';
            const precoFormatado = sabor.preco !== undefined && sabor.preco !== null ? sabor.preco : 0.00;

            tr.innerHTML = `
                <td><strong>${sabor.nome}</strong></td>
                <td>${sabor.categoria}</td>
                <td>
                    <input type="number" step="0.50" class="input-preco-tabela" id="preco-${sabor.id}" value="${precoFormatado}">
                    <button class="btn-action" style="background:#d63384; color:white;" onclick="atualizarPreco(${sabor.id})">Salvar</button>
                </td>
                <td><span class="badge ${statusClass}">${statusTexto}</span></td>
                <td>${sabor.destaque ? '⭐ Sim' : 'Não'}</td>
                <td>
                    <button class="btn-action btn-toggle" onclick="alternarStatus(${sabor.id}, '${sabor.status}')">
                        ${sabor.status === 'disponivel' ? 'Indisponível' : 'Disponível'}
                    </button>
                    <button class="btn-action btn-star" onclick="alternarDestaque(${sabor.id}, ${sabor.destaque})">
                        ${sabor.destaque ? 'Remover' : 'Destacar'}
                    </button>
                    <button class="btn-action btn-delete" onclick="excluirSabor(${sabor.id})">Excluir</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        const stats = document.getElementById('stats-container');
        stats.innerHTML = `
            <div class="stat-card">
                <h3>${totalSabores}</h3>
                <p>Total de Itens</p>
            </div>
            <div class="stat-card">
                <h3>${disponiveis}</h3>
                <p>Ativos na Loja</p>
            </div>
            <div class="stat-card">
                <h3>${maisVendidoSabor.nome}</h3>
                <p>🏆 Mais Vendido (${maisVendidoSabor.vendas || 0}x)</p>
            </div>
        `;
    }

    async function adicionarSabor() {
        const nome = document.getElementById('novo-sabor-nome').value.trim();
        const categoria = document.getElementById('novo-sabor-categoria').value;
        const preco = parseFloat(document.getElementById('novo-sabor-preco').value) || 0;

        if (!nome) {
            alert('Digite o nome do sabor.');
            return;
        }

        const { error } = await supabaseClient
            .from('flavors')
            .insert([{ nome: nome, categoria: categoria, preco: preco, status: 'disponivel', vendas: 0, destaque: false }]);

        if (error) {
            alert('Erro ao cadastrar: ' + error.message);
        } else {
            document.getElementById('novo-sabor-nome').value = '';
            document.getElementById('novo-sabor-preco').value = '';
            carregarPainelAdmin();
        }
    }

    async function atualizarPreco(id) {
        const novoPreco = parseFloat(document.getElementById(`preco-${id}`).value);
        if (isNaN(novoPreco)) {
            alert('Insira um preço válido.');
            return;
        }

        const { error } = await supabaseClient
            .from('flavors')
            .update({ preco: novoPreco })
            .eq('id', id);

        if (error) {
            alert('Erro ao atualizar preço: ' + error.message);
        } else {
            alert('Preço atualizado com sucesso! ❤️');
            carregarPainelAdmin();
        }
    }

    async function alternarStatus(id, statusAtual) {
        const novoStatus = statusAtual === 'disponivel' ? 'indisponivel' : 'disponivel';
        await supabaseClient.from('flavors').update({ status: novoStatus }).eq('id', id);
        carregarPainelAdmin();
    }

    async function alternarDestaque(id, destaqueAtual) {
        await supabaseClient.from('flavors').update({ destaque: !destaqueAtual }).eq('id', id);
        carregarPainelAdmin();
    }

    async function excluirSabor(id) {
        if (confirm('Tem certeza que deseja excluir este sabor permanentemente?')) {
            await supabaseClient.from('flavors').delete().eq('id', id);
            carregarPainelAdmin();
        }
    }

    document.addEventListener('DOMContentLoaded', carregarPainelAdmin);
</script>
</body>
</html>
